; ============================================================================
; Outlast VR
; ============================================================================
; You do not need to edit this file. Everything worth changing is in the
; in-game menu: press INSERT while playing, and press "Save these settings"
; when you like what you see. That writes your choices back here.
;
; This file lives next to OLGame.exe. If it goes missing the mod does nothing
; at all, which is deliberate: the engine addresses below are what make it
; safe to run.
; ============================================================================

[Stage3]
; SAFETY GATES. The mod attaches to specific places in the game's code, and it
; refuses to attach unless the running game is the exact build these addresses
; were read from: the file name has to match, and so do the actual bytes at
; each address. If Outlast ever updates, the mod switches itself off instead of
; writing into the wrong place. Do not edit anything in this block.
Exe=OLGame.exe
CalcSceneViewRva=0x62A020
Prologue=488BC4555356574154415541564157488DA8D8FDFFFF4881EC580300
DrawRva=0x62FBC0
DrawSize=9764
GetViewPointRva=0x168E50
; These three give the second eye its own scene view state. They are DELIBERATELY 0.
; In this engine the post-process chain hangs off that object, so an eye built from a
; freshly allocated one renders without the night vision tint, without the colour
; grading and with its own exposure, and the two eyes visibly disagree. Measured live
; 2026-08-04. They were originally added to chase a mesh flicker, changed nothing, and
; that flicker was fixed later by OcclForce instead. Do not switch them back on.
AllocViewStateRva=0
SharedStateRva=0
StateCreatorRva=0
OcclRva=0x29AEF0
OcclPrologue=4055565741554156488D6C24C04881EC40010000488B05FD62C20148
PvsRva=0x8A7810
PvsPrologue=488BC44C894018488950104889480855535657415441554156415748

; Stereo mode. Leave this alone.
Mode=split

; 3D depth, the "Depth" slider in the menu. Higher gives a stronger 3D effect
; and makes the world feel slightly smaller.
HalfEyeUU=4.500

; How far the camera moves when you lean: the "Lean amount" slider. 1.00 moves
; the camera exactly as far as you move, which is also the steadiest setting.
; Lower is subtler, higher is exaggerated (0.5 - 2.0).
LeanGain=1.000

; Legacy scale key, no longer used by the lean (it runs at the game's measured
; 100 units per metre). Left here so an older settings file still loads.
WorldToMeters=50.000

; Look around with your head. This is the whole point of the mod.
HeadTracking=1

; Leaning and ducking move the in-game camera. The camera only starts following
; your body once it knows where "sat still" is: recenter once you are settled,
; or just put the headset on and hold still for a second. Recenter again any
; time it feels off. 0 = the camera stays exactly where the game puts it.
HeadPosition=1

; Tilting your head sideways tilts the picture. Off: the game keeps the horizon
; level and the two would fight each other.
HeadRoll=0

; Swap left and right eye. Only needed if the 3D looks inside out.
EyeSwap=1

; Cutscenes render wide so they surround you instead of playing in a small
; window. Switches on shortly after you start playing.
CineFov=1

; The camcorder's night vision light is aimed by your body, not your head, so
; turning your head used to leave the lit area behind. This aims it where you
; are actually looking.
NvLight=1

; Keeps solid objects from flickering in and out in 3D. The game decides what
; to draw using a test that assumes one picture per frame, and VR needs two.
; Turning this off brings the flickering back.
OcclForce=1

[Render]
; RESOLUTION IS AUTOMATIC. Left blank, the mod renders at your desktop
; resolution, which is the sharpest this game can do: it always sizes its
; picture from its own window, so asking for more than the desktop produces a
; stretched, distorted image rather than a bigger one.
; Only set these if the game will not hold a smooth framerate, in which case
; something like 2560 x 1440 costs sharpness and buys performance.
; ResX=3840
; ResY=2160

; Wider view: the render fills the headset's full width instead of stopping at 88 degrees.
; More world in the corners of your eyes, slightly softer picture. 1 = on, 0 = off.
WideFov=1

; Puts the game back into proper fullscreen if Windows drops it out, which it
; sometimes does when a headset connects. Without this the picture gets softer.
AutoFullscreen=1

; Which stereo model builds the two eye images. 1 is the Mass Effect model and is
; what the mod ships with: focus distance costs no field of view at any setting,
; and Swap keeps the 3D correct while changing which distance sits flat.
; 0 is the original Outlast model, kept only as an escape hatch. It trims the
; edges off your view whenever focus distance moves, and its Swap inverts the 3D
; so near objects cannot be fused. There is no reason to choose it.
StereoModel=1

; Where things sit in depth, the "Focus distance" slider. Raise it a little if
; close objects look doubled or feel hard to look at.
Convergence=-0.050

; Settles small shakes while you hold still and gets out of the way as soon as
; you turn your head. Lower it if looking around feels slow to respond.
Smoothing=0.400

; Draws the game's own menus and readouts into both eyes. Without this each eye
; sees a different half of them.
UiMirror=1

; The camcorder readouts, the "Camcorder display" sliders. The game draws the
; battery meter and record light right at the edges of the picture, where a
; headset lens cannot show them. These pull them into view.
HudScalePct=63
HudOffsetXPct=0
HudOffsetYPct=0

; Shows narrow cameras on a flat screen instead of around you. Zero means off,
; which is what you want: everything stays in the world.
CinemaScreenBelowDeg=0.000

[Input]
; Recenter the view. Use this whenever the world stops lining up with where you
; are actually sitting. Both of these can be changed from the in-game menu.
;
; Keyboard key, as a Windows key code. 71 is G, picked because Outlast itself
; already uses W A S D Q E F R J N Tab and Space.
RecenterKey=71

; Controller button, double tapped. 256 is L1, the left bumper. Double tapped
; rather than single so it cannot happen by accident mid-chase.
RecenterPad=256

; The key that opens the settings menu. 45 is INSERT. Change this if your
; keyboard does not have an INSERT key, or from inside the menu itself.
MenuKey=45

[Menu]
; The settings menu opens by itself the first time the mod runs, so a new player
; finds out it exists. Set this back to 0 to make that happen again.
Introduced=1

[XR]
; Set this to 0 to run the game flat on the monitor with the mod loaded but no
; headset involved.
Enabled=1
